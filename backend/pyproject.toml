[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pgvector",
    "psycopg2-binary",
    "anthropic",
    "fastembed",
    "pypdf",
    "pydantic-settings",
    "python-multipart",
    "tiktoken",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools]
packages = []
